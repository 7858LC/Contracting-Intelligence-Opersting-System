services:
  - type: web
    name: cios-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: infra/docker/Dockerfile.api
    dockerContext: apps/api
    healthCheckPath: /health
    # Runs once per deploy, in the built image, before this release starts
    # receiving traffic. A non-zero exit aborts the deploy and keeps the
    # previous release live — migrations were previously a manual step run
    # by hand against production, which is exactly the kind of thing that
    # gets forgotten under time pressure. alembic.ini lives at the image's
    # WORKDIR (/app) since dockerContext is apps/api, so no cd is needed.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      # Knowledge Vault ingestion dependencies — required for
      # publish-to-vault / document upload vectorization to succeed. Missing
      # in production undetected until the first real ingestion attempt;
      # see QDRANT_URL/QDRANT_API_KEY and VOYAGE_API_KEY below on cios-worker
      # for the matching comment on why both services need these.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      # cios/core/storage.py — the upload/download/delete endpoints in
      # knowledge_vault.py and winning_profile.py's publish-to-vault call
      # this directly (not via a task), so cios-api needs real S3-compatible
      # credentials too, not just cios-worker below. Config.py's defaults
      # (empty access key/secret) work fine for local dev without real
      # storage configured — every call just fails with an auth error until
      # these are set, the same "unconfigured until the first real attempt"
      # trap QDRANT_URL/VOYAGE_API_KEY already had here once.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_DOCUMENTS
        sync: false
      - key: S3_REGION
        sync: false

  # Every async feature — Knowledge Vault ingestion/vectorization, bid
  # analysis scoring, PIR scans, WPH capture-package vault publishing, the
  # quarterly Executive Council brief — is a Celery task queued via .delay().
  # Without this service those tasks queue into Redis and nothing ever
  # processes them; the API call itself still returns success, so the
  # failure is invisible until someone notices the result never arrives.
  #
  # -B embeds Celery Beat (the scheduler) in this same process, which is only
  # safe with exactly one instance of this service. If this ever needs to
  # scale beyond one instance, split beat into its own single-instance
  # service first — running -B on more than one worker double-fires every
  # scheduled task (the daily PIR scan, the quarterly research brief).
  #
  # -Q must list every queue any task actually routes to (see
  # cios/tasks/__init__.py's task_routes, plus each task's own queue=
  # override) — grep cios/tasks/*.py for `queue=` before adding a new task
  # module, and add its queue here if it's a new one. Missing one here means
  # Celery silently never runs the tasks routed to it.
  - type: worker
    name: cios-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: infra/docker/Dockerfile.api
    dockerContext: apps/api
    # worker-entrypoint.sh backs off with increasing delay between restarts
    # instead of Render's default instant-restart-on-crash. Without it, a
    # Redis outage that this process can't recover from on its own (see the
    # ssl_cert_reqs/rediss:// comment above for the other kind of unrecoverable
    # startup failure) turns into a tight crash loop where every restart still
    # opens a fresh Redis connection and adds to usage/cost while doing zero
    # real work — which is exactly what happened during an Upstash "max
    # requests limit exceeded" lockout.
    # --without-gossip/mingle/heartbeat: those bootsteps exist for
    # multi-worker clusters to exchange state and detect peers; with exactly
    # one worker process they have nothing to coordinate with and just add a
    # steady stream of pub/sub commands against the broker (heartbeat alone
    # publishes every 2s by default) with no benefit — pure background cost
    # on a per-command-billed Redis.
    dockerCommand: >-
      bash scripts/worker-entrypoint.sh
      celery -A cios.tasks worker -B --loglevel=info --concurrency=2
      --without-gossip --without-mingle --without-heartbeat
      -Q celery,simulations,ingestion,analysis,email,pir_scan,research
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      # Tells cios/core/database.py to use NullPool instead of a real
      # connection pool — required because every task body calls
      # asyncio.run() (a fresh event loop per task), and asyncpg connections
      # can't be reused across different event loops. Never set this on
      # cios-api above.
      - key: CIOS_WORKER_PROCESS
        value: "1"
      # ingest_document / vectorize_past_performance call TenantVectorStore,
      # which needs both a Qdrant instance (per-tenant vector isolation) and
      # a Voyage AI key (embedding generation). Neither was ever provisioned
      # for production until the first real publish-to-vault attempt failed
      # on each of these in turn — cios_worker.ensure_collection() against
      # an unset QDRANT_URL, then voyageai raising AuthenticationError on an
      # unset VOYAGE_API_KEY. Local dev gets Qdrant for free from
      # docker-compose; production needs a real hosted instance (Qdrant
      # Cloud) and a real Voyage AI key, set here explicitly.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      # ingest_document downloads the original file from object storage
      # before extracting text from it (cios/core/storage.py) — same
      # "needed on both services" reasoning as Qdrant/Voyage above, since
      # this task runs here, not in cios-api.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_DOCUMENTS
        sync: false
      - key: S3_REGION
        sync: false
      # scan_company/bulk_radar_scan (cios/tasks/pir.py) run SAMGovScanner
      # here, not in cios-api. Never wired up here before, so every SAM.gov
      # entity/award lookup went out with an empty api_key — SAM.gov rejects
      # that outright — and every Procurement Radar scan silently failed
      # before it could find anything, for any company. Get a real key from
      # https://sam.gov/data-services; the scanner falls back to the
      # heavily rate-limited "DEMO_KEY" if this is left unset, not to
      # nothing, but that's only for evaluation, not sustained production use.
      - key: SAM_GOV_API_KEY
        sync: false
